mode = "light"

# Solstice Daylight — Screenshot-calibrated Solaris 9 CDE palette.
# Derived from solCDE.jpg / solcdegeneral.png / the Solaris-9 B00merang port.
#
# Chrome   #AEB2C3  grey-lavender panels, bars, menubars (pixel-extracted)
# Canvas   #FFF7E9  warm cream text-editor / terminal background
# Trough   #9497A6  scrollbar troughs, recessed surfaces
# Rose     #B24D7A  selection, active titlebar, focus, hover highlight
#
# ANSI palette given in the canonical color0..color15 form; Omarchy's resolver
# (omarchy-theme-color) maps color1..color6 / color9..color14 back to the
# semantic red/green/yellow/blue/magenta/cyan names the templates consume.
# color0/color7 are pinned to background/foreground by the resolver, so the
# inverted light-theme ANSI (black = chrome, white = ink) is intentional.

# ── Structure ────────────────────────────────────────────────────────────────
accent               = "#B24D7A"
selection            = "#B24D7A"
selection_background = "#B24D7A"
selection_foreground = "#FFFFFF"

background           = "#AEB2C3"
dark_background      = "#9497A6"
darker_background    = "#808898"
lighter_background   = "#C2C4C8"

foreground           = "#000000"
dark_foreground      = "#808898"
light_foreground     = "#585A6A"

# Semantic colors without a color0..color15 slot.
orange               = "#C2591E"   # battery/low indicators; not yellow
brown                = "#8B7355"

# ── Hyprland borders ───────────────────────────────────────────────────────
hyprland_active_border   = "#B24D7A"
hyprland_inactive_border = "#9497A6"

# ── ANSI 16-color palette (canonical) ──────────────────────────────────────
color0  = "#AEB2C3"   # black   (chrome — background)
color1  = "#C23D3D"   # red
color2  = "#4A7A5A"   # green
color3  = "#8D6D2B"   # yellow (darkened from screenshot-extracted #C4983B for
                      #         WCAG 4.5:1 on cream; hue preserved)
color4  = "#4A6DA0"   # blue
color5  = "#B24D7A"   # magenta (rose accent)
color6  = "#5A8A8A"   # cyan
color7  = "#000000"   # white   (ink — foreground)
color8  = "#585A6A"   # br black  (muted)
color9  = "#CF5555"   # br red
color10 = "#5A8A6A"   # br green
color11 = "#A18026"   # br yellow (darkened from screenshot-extracted #D4B04B,
                      #           3.5:1 on cream; hue preserved)
color12 = "#5A7DB0"   # br blue
color13 = "#C86090"   # br magenta
color14 = "#6A9A9A"   # br cyan
color15 = "#000000"   # br white  (bright foreground)
